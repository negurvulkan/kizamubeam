[package]
name = "kizamubeam"
version = "1.2.1-beta"
description = "Freie Laser-Software (Prototyp)"
license = "GPL-3.0-or-later"
edition = "2021"

[workspace]
members = ["core"]

[lib]
name = "kizamubeam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Updates aus den GitHub-Releases (siehe src/updater.rs)
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
dirs = "7"
fontdb = "0.23"
kizamubeam-core = { path = "core" }
# ohne libudev, damit unter Linux keine zusätzliche Systembibliothek nötig ist
serialport = { version = "4", default-features = false }
# WebSocket zur Steuerung (FluidNC Port 81), ohne TLS
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
