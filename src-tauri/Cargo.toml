[package]
name = "laserwerk"
version = "0.1.0"
description = "Freie Laser-Software (Prototyp)"
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "laserwerk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
dirs = "7"
fontdb = "0.23"
# ohne libudev, damit unter Linux keine zusätzliche Systembibliothek nötig ist
serialport = { version = "4", default-features = false }
