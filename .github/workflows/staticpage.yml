# Deploys the static product website in website/ to GitHub Pages.
# The generated HTML is committed, so no build is needed to deploy; the
# check step only makes sure it matches template.html + i18n/*.json.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check that the committed HTML is up to date
        run: |
          node website/build.mjs
          if ! git diff --quiet -- website; then
            echo "::error::website/ is out of date. Run 'node website/build.mjs' and commit the result."
            git --no-pager diff --stat -- website
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
