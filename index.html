<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KizamuBeam</title>
    <link rel="icon" type="image/png" href="/src/assets/brand/symbol-64.png" />
  </head>
  <body>
    <div id="app">
      <nav id="menubar"></nav>
      <div id="toolbar" class="bar"></div>
      <div id="numbar" class="bar"></div>
      <main id="main">
        <aside id="tools"></aside>
        <aside id="dock-left" class="dock"></aside>
        <div id="center">
          <div id="tabbar" role="tablist"></div>
          <section id="stage">
            <canvas id="canvas"></canvas>
            <div id="texteditor" hidden>
              <textarea spellcheck="false" placeholder="Text eingeben …"></textarea>
              <div class="hint">Enter: neue Zeile · Ctrl+Enter oder Esc: fertig</div>
            </div>
          </section>
        </div>
        <aside id="dock-right" class="dock"></aside>
      </main>
      <div id="palette"></div>
      <footer id="status"></footer>
    </div>
    <input type="file" id="fileinput" accept=".kzb,.kzt,.lwk,.json" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
