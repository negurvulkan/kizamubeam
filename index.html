<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laserwerk</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app">
      <nav id="menubar"></nav>
      <div id="toolbar" class="bar"></div>
      <div id="numbar" class="bar"></div>
      <main id="main">
        <aside id="tools"></aside>
        <section id="stage">
          <canvas id="canvas"></canvas>
          <div id="texteditor" hidden>
            <textarea spellcheck="false" placeholder="Text eingeben …"></textarea>
            <div class="hint">Enter: neue Zeile · Ctrl+Enter oder Esc: fertig</div>
          </div>
        </section>
        <aside id="right">
          <div class="panel" id="layers-panel">
            <div class="panel-title">Schnitte / Layer</div>
            <div class="panel-body" id="layers"></div>
          </div>
          <div class="panel" id="objects-panel">
            <div class="panel-title">Objekte</div>
            <div class="panel-body" id="objects"></div>
          </div>
          <div class="panel" id="laser-panel">
            <div class="panel-title">Laser</div>
            <div class="panel-body" id="laser"></div>
          </div>
        </aside>
      </main>
      <div id="palette"></div>
      <footer id="status"></footer>
    </div>
    <input type="file" id="fileinput" accept=".lwk,.json" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
